name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vw-bridge-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check main.py monitor.py smartthings_mcp.py tests
      - run: bash -n scripts/deploy.sh

  deploy:
    needs: test
    runs-on: [self-hosted, Linux, X64, vw-bridge]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: scripts/deploy.sh